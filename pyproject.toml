[project]
name = "gridwise"
version = "0.1.0"
description = "GridWise — LLM-assisted smart campus energy optimizer (BUP CSE Fest 2026 preliminary)"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "numpy>=2.4.2",
    "scipy>=1.17.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.15",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["docs", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "W"]
ignore = [
    # The optimizer builds explicit index maps; short mathematical names are intentional there.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# An embedded HTML/JS template, not Python: wrapping its lines would corrupt the markup.
"app/demo/page.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not live'"
markers = [
    "live: hits a real LLM provider; excluded from CI and normal local runs",
    "slow: long-running property or benchmark test",
]
